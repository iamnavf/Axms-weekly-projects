<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}Brazilian E-Commerce Dashboard{% endblock %}
    </title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<div class="wrapper">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
        <div class="logo">
            <div>
                <h3>Business Analytics</h3>
            </div>
        </div>
        <ul class="nav flex-column mt-4 menu">
            <li class="nav-item mb-1 {% if request.endpoint == 'dashboard' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('dashboard') }}">
                     Dashboard
                </a>
            </li>
            <li class="nav-item mb-1 {% if request.endpoint == 'sales' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('sales') }}">
                    Sales Analytics
                </a>
            </li>
            <li class="nav-item mb-1 {% if request.endpoint == 'customer' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('customer') }}">
                    Customer Analytics
                </a>
            </li>
            <li class="nav-item mb-1 {% if request.endpoint == 'product' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('product') }}">
                     Product Analytics
                </a>
            </li>
            <li class="nav-item mb-1 {% if request.endpoint == 'seller' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('seller') }}">
                     Seller Analytics
                </a>
            </li>
            <li class="nav-item mb-1 {% if request.endpoint == 'delivery' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('delivery') }}">
                     Delivery Analytics
                </a>
            </li>
            <li class="nav-item mb-1 {% if request.endpoint == 'payment_review' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('payment_review') }}">
                     Payment & Review
                </a>
            </li>
            <li class="nav-item mb-1 {% if request.endpoint == 'explorer' %}active{% endif %}">
                <a class="nav-link" href="{{ url_for('explorer') }}">
                     Dataset Explorer
                </a>
            </li>
        </ul>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
