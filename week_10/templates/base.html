<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Customer Intelligence Platform
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <nav class="navbar navbar-expand-lg platform-navbar">

        <div class="container">
            <a
                class="navbar-brand platform-brand"
                href="{{ url_for('home') }}"
            >

                <span class="brand-icon">
                    CI
                </span>

                <span class="brand-text">

                    Customer Intelligence

                </span>

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="mainNavbar"
            >

                <ul class="navbar-nav navbar-links">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('home') }}"
                        >
                            Home
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('prediction') }}"
                        >
                            Prediction
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('assistant') }}"
                        >
                            AI Assistant
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!--FOOTER-->

    <footer class="platform-footer">

        <div class="container">

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
