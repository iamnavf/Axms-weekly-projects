{% extends "base.html" %}

{% block title %}
Customer Search
{% endblock %}

{% block content %}

<h2>Customer Search</h2>

<form action="/analyze" method="POST">

```
<div>
    <label for="customer_id">Customer ID</label>
    <input
        type="text"
        id="customer_id"
        name="customer_id"
        placeholder="Enter Customer ID"
        required
    >
</div>

<br>

<div>
    <label for="question">Ask a Question</label>
    <input
        type="text"
        id="question"
        name="question"
        placeholder="Why is this customer at high risk?"
        required
    >
</div>

<br>

<button type="submit">Analyze Customer</button>
```

</form>

{% endblock %}
