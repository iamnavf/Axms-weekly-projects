<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skin Disease Detection Dashboard{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 bg-dark text-white min-vh-100 p-3">

            <h3 class="text-center mb-4">
                <i class="bi bi-heart-pulse"></i>
                Skin AI
            </h3>

            <ul class="nav flex-column">

                <li class="nav-item mb-2">
                    <a href="/" class="nav-link text-white">
                        <i class="bi bi-house"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="/diagnosis" class="nav-link text-white">
                        <i class="bi bi-image"></i>
                        Image Diagnosis
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="/analytics" class="nav-link text-white">
                        <i class="bi bi-pie-chart"></i>
                        Model Analytics
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="/report" class="nav-link text-white">
                        <i class="bi bi-file-earmark-arrow-down"></i>
                        Reports
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->
        <div class="col-md-10">

            <!-- Navbar -->
            <nav class="navbar navbar-light bg-light shadow-sm mb-4">

                <div class="container-fluid">

                    <span class="navbar-brand mb-0 h4">
                        Skin Disease Classification Dashboard
                    </span>

                </div>

            </nav>

            <div class="container">

                {% block content %}
                {% endblock %}

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
