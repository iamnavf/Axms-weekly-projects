{% extends 'base.html' %}
{% block title %}login{% endblock %}

{% block content %}
<div class="container my-5 py-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
                <div class="row g-0">
                    <!-- Left Column Form Area -->
                    <div class="col-md-6 p-4 p-sm-5 d-flex flex-column justify-content-center">
                        <div class="mb-4">
                            <h2 class="fw-bold text-dark tracking-tight hero-title-main">Welcome Back</h2>
                            <p class="text-muted small">Log in.</p>
                        </div>

                        <form method="POST" action="/login">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                                <input type="email" name="email" class="form-control rounded-3 small" placeholder="enter email" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Password</label>
                                <input type="password" name="password" class="form-control rounded-3 small" placeholder="enter password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-medium shadow-sm mb-2">log In</button>
                        </form>

                        <div class="text-center mt-3 small">
                            <span class="text-muted">New to the Platform?</span> 
                            <a href="/register" class="text-decoration-none fw-bold text-dark ms-1">Sign Up</a>
                        </div>
                    </div>


                    <div class="col-md-6 bg-dark text-white p-5 d-none d-md-flex flex-column justify-content-center text-center position-relative">
                        <h4 class="fw-bold mb-2">Secure Gateway</h4>
                        <p class="small text-white-50 px-3 mb-0">Profile passwords are fully cryptographically hashed and salted behind zero-knowledge access vectors.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
